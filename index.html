<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMCE Evolución — SLEP Del Pino</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,300;0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --navy: #0f2645;
    --teal: #1a7a6e;
    --gold: #c8922a;
    --red: #c0392b;
    --slate: #4a5568;
    --light: #f7f8fc;
    --border: #e2e8f0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--light);
    color: #1a202c;
    min-height: 100vh;
  }

  /* ─── HEADER ─── */
  header {
    background: var(--navy);
    color: white;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
  .header-brand { display: flex; align-items: center; gap: 14px; }
  .header-logo {
    width: 46px; height: 46px; background: var(--teal);
    border-radius: 10px; display: flex; align-items: center;
    justify-content: center; font-size: 22px;
  }
  .header-title { font-family: 'Source Serif 4', serif; }
  .header-title h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
  .header-title p { font-size: 0.75rem; color: #94a3b8; margin-top: 1px; }
  .header-badge {
    background: var(--gold); color: white; padding: 4px 12px;
    border-radius: 20px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em;
  }

  /* ─── SEARCH BAR ─── */
  .search-section {
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .search-wrapper {
    position: relative; flex: 1; max-width: 520px;
  }
  .search-wrapper input {
    width: 100%; padding: 10px 16px 10px 42px;
    border: 2px solid var(--border); border-radius: 10px;
    font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
    outline: none; transition: border-color 0.2s;
    background: var(--light);
  }
  .search-wrapper input:focus { border-color: var(--teal); background: white; }
  .search-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--slate); font-size: 15px; pointer-events: none;
  }
  #search-results {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: white; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12); z-index: 200;
    max-height: 280px; overflow-y: auto;
  }
  .result-item {
    padding: 10px 16px; cursor: pointer; display: flex;
    justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border); transition: background 0.15s;
  }
  .result-item:hover { background: #f0fdf9; }
  .result-name { font-size: 0.85rem; font-weight: 500; }
  .result-meta { font-size: 0.75rem; color: var(--slate); }
  .btn-pdf {
    background: var(--navy); color: white; border: none;
    padding: 10px 20px; border-radius: 10px; font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: background 0.2s;
  }
  .btn-pdf:hover { background: #1a3a5c; }

  /* ─── MAIN CONTENT ─── */
  main {
    max-width: 1280px; margin: 0 auto; padding: 28px 32px;
  }
  .empty-state {
    text-align: center; padding: 80px 40px; color: var(--slate);
  }
  .empty-state svg { width: 120px; height: 120px; opacity: 0.3; margin-bottom: 24px; }
  .empty-state h2 { font-size: 1.4rem; margin-bottom: 8px; }

  .school-header {
    background: white; padding: 24px 28px; border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 24px;
  }
  .school-name { font-family: 'Source Serif 4', serif; font-size: 1.6rem; font-weight: 600; margin-bottom: 6px; }
  .school-meta { color: var(--slate); font-size: 0.92rem; }

  .charts-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
    gap: 24px; margin-bottom: 24px;
  }
  .chart-card {
    background: white; padding: 24px; border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .chart-title {
    font-size: 1.05rem; font-weight: 600; margin-bottom: 16px;
    color: var(--navy); display: flex; align-items: center; gap: 8px;
  }
  .chart-canvas {
    position: relative; height: 320px;
  }

  .comparison-section {
    background: white; padding: 24px; border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 24px;
  }
  .comparison-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px; margin-top: 16px;
  }
  .comparison-card {
    padding: 16px; background: var(--light); border-radius: 8px;
    text-align: center;
  }
  .comparison-label { font-size: 0.82rem; color: var(--slate); margin-bottom: 6px; }
  .comparison-value { font-size: 1.4rem; font-weight: 700; color: var(--navy); }
  .comparison-diff {
    font-size: 0.85rem; margin-top: 4px; font-weight: 500;
  }
  .diff-positive { color: #059669; }
  .diff-negative { color: #dc2626; }

  @media (max-width: 768px) {
    .charts-grid { grid-template-columns: 1fr; }
    .comparison-grid { grid-template-columns: 1fr; }
  }

  @media print {
    header, .search-section, .btn-pdf, .comparison-section { display: none; }
    .chart-card { page-break-inside: avoid; }
  }
</style>
</head>

<header>
  <div class="header-brand">

    <div class="header-title">

    </div>
  </div>
  <div class="header-badge">2016–2025</div>
</header>

<div class="search-section">
  <div class="search-wrapper">
    <span class="search-icon">🔍</span>

    <div id="search-results"></div>
  </div>
  <button class="btn-pdf" id="btn-download-pdf" style="display:none;">
    <span>📥</span> Descargar Informe PDF

</div>

<main id="main-content">

    <div id="comparison-container"></div>

  </div>
</main>

let selectedSchool = null;
let allCharts = {};

// Initialize
Chart.register(ChartDataLabels);

// Search functionality
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase().trim();
  
  if (query.length < 2) {
    searchResults.innerHTML = '';
    searchResults.style.display = 'none';
    return;
  }

  const matches = SCHOOLS_DATA.filter(school => 
    school.NOM_RBD.toLowerCase().includes(query) || 
    (school.rbd && school.rbd.toString().includes(query))
  ).slice(0, 10);

  if (matches.length > 0) {
    searchResults.innerHTML = matches.map(school => `
      <div class="result-item" onclick="selectSchool(${school.rbd})">
        <div>
          <div class="result-name">${school.NOM_RBD}</div>
          <div class="result-meta">RBD: ${school.rbd}</div>
        </div>
      </div>
    `).join('');
    searchResults.style.display = 'block';
  } else {
    searchResults.innerHTML = '<div class="result-item"><div class="result-name">No se encontraron resultados</div></div>';
    searchResults.style.display = 'block';
  }
});

// Close search results when clicking outside
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrapper')) {
    searchResults.style.display = 'none';
  }
});

function selectSchool(rbd) {
  selectedSchool = SCHOOLS_DATA.find(s => s.rbd === rbd);
  if (selectedSchool) {
    displaySchool(selectedSchool);
    searchInput.value = selectedSchool.NOM_RBD;
    searchResults.style.display = 'none';
  }
}

function displaySchool(school) {
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('school-view').style.display = 'block';
  document.getElementById('btn-download-pdf').style.display = 'flex';

  document.getElementById('school-name').textContent = school.NOM_RBD;
  document.getElementById('school-meta').textContent = `RBD: ${school.rbd}`;

  // Clear previous charts
  Object.values(allCharts).forEach(chart => chart.destroy());
  allCharts = {};

  // Display comparison with SLEP
  displayComparison(school);

  // Display all charts
  displayAllCharts(school);
}

function displayComparison(school) {
  const container = document.getElementById('comparison-container');
  
  const comparisons = [];
  const levels = [
    { code: '4b', name: '4° Básico', year: '2024' },
    { code: '6b', name: '6° Básico', year: '2024' },
    { code: '2m', name: '2° Medio', year: '2024' }
  ];
  const subjects = [
    { code: 'len', name: 'Lenguaje' },
    { code: 'mat', name: 'Matemática' }
  ];

  levels.forEach(level => {
    subjects.forEach(subject => {
      const key = `prom_${level.code}_${subject.code}_${level.year}`;
      const schoolValue = school[key];
      
      if (schoolValue !== null && schoolValue !== undefined) {
        const slepAvg = calculateSLEPAverage(key);
        if (slepAvg !== null) {
          const diff = schoolValue - slepAvg;
          comparisons.push({
            label: `${level.name} ${subject.name}`,
            value: schoolValue.toFixed(0),
            diff: diff,
            slepAvg: slepAvg.toFixed(0)
          });
        }
      }
    });
  });

  if (comparisons.length > 0) {
    container.innerHTML = `
      <div class="comparison-section">
        <h3 class="chart-title">📊 Comparación con Promedio SLEP (2024)</h3>
        <div class="comparison-grid">
          ${comparisons.map(c => `
            <div class="comparison-card">
              <div class="comparison-label">${c.label}</div>
              <div class="comparison-value">${c.value}</div>
              <div class="comparison-diff ${c.diff >= 0 ? 'diff-positive' : 'diff-negative'}">
                ${c.diff >= 0 ? '+' : ''}${c.diff.toFixed(0)} pts vs SLEP (${c.slepAvg})
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } else {
    container.innerHTML = '';
  }
}

function calculateSLEPAverage(key) {
  const validValues = SCHOOLS_DATA
    .map(s => s[key])
    .filter(v => v !== null && v !== undefined && !isNaN(v));
  
  if (validValues.length === 0) return null;
  return validValues.reduce((a, b) => a + b, 0) / validValues.length;
}

function displayAllCharts(school) {
  const container = document.getElementById('charts-container');
  container.innerHTML = '';

  // Define all possible configurations
  const configs = [
    { level: '4b', levelName: '4° Básico', subject: 'len', subjectName: 'Lenguaje', years: ['2016', '2017', '2018', '2022', '2023', '2024', '2025'] },
    { level: '4b', levelName: '4° Básico', subject: 'mat', subjectName: 'Matemática', years: ['2016', '2017', '2018', '2022', '2023', '2024', '2025'] },
    { level: '6b', levelName: '6° Básico', subject: 'len', subjectName: 'Lenguaje', years: ['2016', '2018', '2024'] },
    { level: '6b', levelName: '6° Básico', subject: 'mat', subjectName: 'Matemática', years: ['2016', '2018', '2024'] },
    { level: '8b', levelName: '8° Básico', subject: 'len', subjectName: 'Lenguaje', years: ['2025'] },
    { level: '8b', levelName: '8° Básico', subject: 'mat', subjectName: 'Matemática', years: ['2025'] },
    { level: '2m', levelName: '2° Medio', subject: 'len', subjectName: 'Lenguaje', years: ['2016', '2017', '2018', '2022', '2023', '2024', '2025'] },
    { level: '2m', levelName: '2° Medio', subject: 'mat', subjectName: 'Matemática', years: ['2016', '2017', '2018', '2022', '2023', '2024', '2025'] }
  ];

  configs.forEach(config => {
    createEvolutionChart(school, config, container);
  });

  // Create standards charts for 2025 data
  const standardsConfigs = [
    { level: '4B', levelName: '4° Básico', subject: 'LEN', subjectName: 'Lenguaje' },
    { level: '4B', levelName: '4° Básico', subject: 'MAT', subjectName: 'Matemática' },
    { level: '8B', levelName: '8° Básico', subject: 'LEN', subjectName: 'Lenguaje' },
    { level: '8B', levelName: '8° Básico', subject: 'MAT', subjectName: 'Matemática' },
    { level: '2M', levelName: '2° Medio', subject: 'LEN', subjectName: 'Lenguaje' },
    { level: '2M', levelName: '2° Medio', subject: 'MAT', subjectName: 'Matemática' }
  ];

  standardsConfigs.forEach(config => {
    createStandardsChart(school, config, container);
  });
}

function createEvolutionChart(school, config, container) {
  const data = [];
  const labels = [];
  
  config.years.forEach(year => {
    const key = `prom_${config.level}_${config.subject}_${year}`;
    const value = school[key];
    if (value !== null && value !== undefined) {
      labels.push(year);
      data.push(value);
    }
  });

  // Only create chart if we have data
  if (data.length === 0) return;

  const chartCard = document.createElement('div');
  chartCard.className = 'chart-card';
  const chartId = `chart_${config.level}_${config.subject}`;
  
  chartCard.innerHTML = `
    <h3 class="chart-title">📈 ${config.levelName} - ${config.subjectName}</h3>
    <div class="chart-canvas">
      <canvas id="${chartId}"></canvas>
    </div>
  `;
  
  container.appendChild(chartCard);

  const ctx = document.getElementById(chartId).getContext('2d');
  allCharts[chartId] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Puntaje SIMCE',
        data: data,
        borderColor: '#1a7a6e',
        backgroundColor: 'rgba(26, 122, 110, 0.1)',
        borderWidth: 3,
        tension: 0.3,
        fill: true,
        pointRadius: 5,
        pointHoverRadius: 7,
        pointBackgroundColor: '#1a7a6e',
        pointBorderColor: '#fff',
        pointBorderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        datalabels: {
          display: true,
          align: 'top',
          color: '#0f2645',
          font: { weight: 'bold', size: 11 },
          formatter: (value) => Math.round(value)
        }
      },
      scales: {
        y: {
          beginAtZero: false,
          min: 150,
          max: 350,
          ticks: {
            callback: function(value) { return value; }
          },
          title: {
            display: true,
            text: 'Puntaje',
            font: { weight: 'bold' }
          }
        },
        x: {
          title: {
            display: true,
            text: 'Año',
            font: { weight: 'bold' }
          }
        }
      }
    }
  });
}

function createStandardsChart(school, config, container) {
  const adecuado = parseFloat(school[`EDA_ADECUADO_${config.level}_${config.subject}`]) || 0;
  const elemental = parseFloat(school[`EDA_ELEMENTAL_${config.level}_${config.subject}`]) || 0;
  const insuficiente = parseFloat(school[`EDA_INSUFICIENTE_${config.level}_${config.subject}`]) || 0;

  // Only create chart if we have data
  if (adecuado === 0 && elemental === 0 && insuficiente === 0) return;

  const chartCard = document.createElement('div');
  chartCard.className = 'chart-card';
  const chartId = `chart_std_${config.level}_${config.subject}`;
  
  chartCard.innerHTML = `
    <h3 class="chart-title">📊 Estándares de Aprendizaje 2025 - ${config.levelName} ${config.subjectName}</h3>
    <div class="chart-canvas">
      <canvas id="${chartId}"></canvas>
    </div>
  `;
  
  container.appendChild(chartCard);

  const ctx = document.getElementById(chartId).getContext('2d');
  allCharts[chartId] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Distribución'],
      datasets: [
        {
          label: 'Adecuado',
          data: [adecuado],
          backgroundColor: '#059669',
          borderColor: '#047857',
          borderWidth: 2
        },
        {
          label: 'Elemental',
          data: [elemental],
          backgroundColor: '#f59e0b',
          borderColor: '#d97706',
          borderWidth: 2
        },
        {
          label: 'Insuficiente',
          data: [insuficiente],
          backgroundColor: '#dc2626',
          borderColor: '#b91c1c',
          borderWidth: 2
        }
      ]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: true,
          position: 'bottom'
        },
        datalabels: {
          display: true,
          color: '#fff',
          font: { weight: 'bold', size: 14 },
          formatter: (value) => value > 0 ? value.toFixed(1) + '%' : ''
        }
      },
      scales: {
        x: {
          stacked: true,
          max: 100,
          ticks: {
            callback: function(value) { return value + '%'; }
          }
        },
        y: {
          stacked: true
        }
      }
    }
  });
}

// PDF Generation
document.getElementById('btn-download-pdf').addEventListener('click', async () => {
  if (!selectedSchool) return;

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');
  let yPos = 20;

  // Header
  pdf.setFillColor(15, 38, 69);
  pdf.rect(0, 0, 210, 45, 'F');
  
  pdf.setTextColor(255, 255, 255);
  pdf.setFontSize(24);
  pdf.setFont(undefined, 'bold');
  pdf.text('SIMCE - SLEP Del Pino', 105, 20, { align: 'center' });
  
  pdf.setFontSize(14);
  pdf.setFont(undefined, 'normal');
  pdf.text('Informe de Evolución y Resultados', 105, 30, { align: 'center' });

  // School info
  yPos = 55;
  pdf.setTextColor(0, 0, 0);
  pdf.setFontSize(18);
  pdf.setFont(undefined, 'bold');
  const schoolName = selectedSchool.NOM_RBD;
  const lines = pdf.splitTextToSize(schoolName, 170);
  pdf.text(lines, 105, yPos, { align: 'center' });
  
  yPos += lines.length * 7;
  pdf.setFontSize(12);
  pdf.setFont(undefined, 'normal');
  pdf.text(`RBD: ${selectedSchool.rbd}`, 105, yPos, { align: 'center' });

  // Capture all charts as images
  yPos += 15;
  
  for (const [chartId, chart] of Object.entries(allCharts)) {
    const canvas = chart.canvas;
    
    try {
      const imgData = canvas.toDataURL('image/png', 1.0);
      
      if (yPos > 240) {
        pdf.addPage();
        yPos = 20;
      }
      
      // Add chart title
      const isEvolution = chartId.includes('chart_') && !chartId.includes('std');
      const isStandards = chartId.includes('std');
      
      if (isEvolution) {
        const parts = chartId.split('_');
        const level = parts[1];
        const subject = parts[2];
        const levelNames = { '4b': '4° Básico', '6b': '6° Básico', '8b': '8° Básico', '2m': '2° Medio' };
        const subjectNames = { 'len': 'Lenguaje', 'mat': 'Matemática' };
        
        pdf.setFontSize(11);
        pdf.setFont(undefined, 'bold');
        pdf.text(`📈 ${levelNames[level]} - ${subjectNames[subject]}`, 20, yPos);
      } else if (isStandards) {
        const parts = chartId.split('_');
        const level = parts[2];
        const subject = parts[3];
        const levelNames = { '4B': '4° Básico', '8B': '8° Básico', '2M': '2° Medio' };
        const subjectNames = { 'LEN': 'Lenguaje', 'MAT': 'Matemática' };
        
        pdf.setFontSize(11);
        pdf.setFont(undefined, 'bold');
        pdf.text(`📊 Estándares 2025 - ${levelNames[level]} ${subjectNames[subject]}`, 20, yPos);
      }
      
      yPos += 7;
      
      // Add chart image
      const imgWidth = 170;
      const imgHeight = (canvas.height * imgWidth) / canvas.width;
      pdf.addImage(imgData, 'PNG', 20, yPos, imgWidth, Math.min(imgHeight, 80));
      
      yPos += Math.min(imgHeight, 80) + 10;
      
    } catch (error) {
      console.error('Error adding chart to PDF:', error);
    }
  }

  // Footer
  const pageCount = pdf.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    pdf.setPage(i);
    pdf.setFontSize(8);
    pdf.setTextColor(128, 128, 128);
    pdf.text(
      `Página ${i} de ${pageCount} - Generado el ${new Date().toLocaleDateString('es-CL')}`,
      105,
      285,
      { align: 'center' }
    );
  }

  pdf.save(`SIMCE_${selectedSchool.rbd}_${selectedSchool.NOM_RBD.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`);
});
